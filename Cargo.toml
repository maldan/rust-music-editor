[package]
name = "music-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
mega-audio = { path = "../../../rust_lib/mega/audio" }
mega-ui = { path = "../../../rust_lib/mega/ui", features = ["wgpu"] }
glam = { version = "0.33.2", features = ["serde"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
arboard = "3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
mp3lame-encoder = "0.2"

[target.'cfg(windows)'.dependencies]
windows = "0.62"
